name: Scheduled automation

# Şablon zamanlamaları saat bazındadır. Vercel Hobby planı yalnızca günlük cron
# desteklediği için tetikleyici GitHub Actions üzerinden saatte bir çalışır.
# Gerekli repository secret'ı: CRON_SECRET (Vercel ortamındaki CRON_SECRET ile aynı, en az 32 karakter).
# İsteğe bağlı: AUTOMATION_APP_URL (varsayılan: canlı uygulama adresi).
# GitHub zamanlanmış işleri yoğunlukta geciktirebilir; uygulama kaçırılan saatleri 8 saate kadar telafi eder.
on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger due automation templates
        env:
          APP_URL: ${{ secrets.AUTOMATION_APP_URL || 'https://automania-gamma.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning title=Zamanlayıcı kapalı::CRON_SECRET repository secret'ı tanımlı değil; zamanlanmış otomasyonlar tetiklenmiyor."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/automation"
